<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">LeadHarvest: from search to sales-ready</title>
  <desc id="desc">An illustrative search, enrich, validate and score pipeline leads to a fictional sample business record with contact channels and a priority label. This is a workflow diagram, not a product screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173b2e"/><stop offset="1" stop-color="#102d25"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#09c199" stop-opacity=".2"/><stop offset="1" stop-color="#09c199" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1090" cy="600" r="420" fill="url(#glow)"/>
  <path d="M900 0v800M1000 0v800M1100 0v800M0 100h1200M0 200h1200" stroke="#fff" stroke-opacity=".035"/>
  <g font-family="Inter, Arial, sans-serif">
