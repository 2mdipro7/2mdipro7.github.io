    <text x="171" y="604" fill="#426456" font-size="22">Fictional sample record</text>
    <rect x="835" y="547" width="265" height="49" rx="24" fill="#d5ecdf"/>
    <text x="967" y="579" text-anchor="middle" fill="#1c3a30" font-size="24" font-weight="700">Priority: high</text>
