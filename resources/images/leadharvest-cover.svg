    <text x="60" y="182" fill="#fff" font-size="86" font-weight="800" letter-spacing="-3">From search</text>
    <text x="60" y="274" fill="#80f0c7" font-size="96" font-weight="800" letter-spacing="-3">to sales-ready.</text>
    <text x="64" y="325" fill="#c0d9cd" font-size="30">A repeatable prospecting pipeline.</text>
    <g fill="#285142" stroke="#5b8a74" stroke-width="1.5"><rect x="64" y="383" width="238" height="89" rx="14"/><rect x="342" y="383" width="238" height="89" rx="14"/><rect x="620" y="383" width="238" height="89" rx="14"/><rect x="898" y="383" width="238" height="89" rx="14"/></g>
    <g fill="#fff" font-size="31" font-weight="700" text-anchor="middle"><text x="183" y="439">Search</text><text x="461" y="439">Enrich</text><text x="739" y="439">Validate</text><text x="1017" y="439">Score</text></g>
    <path d="M310 427h22m-8-8 8 8-8 8m264-8h22m-8-8 8 8-8 8m264-8h22m-8-8 8 8-8 8" fill="none" stroke="#80f0c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1017 472v22H183v22" fill="none" stroke="#72ae92" stroke-width="2" stroke-dasharray="7 7"/>
