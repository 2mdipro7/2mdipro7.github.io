<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Credit Union: one operations platform</title>
  <desc id="desc">An illustrative operations dashboard brings members, savings and loans together, with a request, review, approval and posting workflow. This is a diagram, not a product screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d25"/><stop offset="1" stop-color="#1c3a30"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#09c199" stop-opacity=".22"/><stop offset="1" stop-color="#09c199" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1040" cy="160" r="370" fill="url(#glow)"/>
  <path d="M900 0v800M1000 0v800M1100 0v800M0 100h1200M0 200h1200" stroke="#fff" stroke-opacity=".035"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="81" fill="#91dfc7" font-size="26" font-weight="700" letter-spacing="4">CREDIT UNION · PROGRAM DELIVERY</text>
    <text x="60" y="182" fill="#fff" font-size="86" font-weight="800" letter-spacing="-3">One operations</text>
    <text x="60" y="274" fill="#80f0c7" font-size="96" font-weight="800" letter-spacing="-3">platform.</text>
    <text x="64" y="325" fill="#c0d9cd" font-size="30">Requirements. Delivery. QA.</text>
    <rect x="64" y="376" width="1072" height="320" rx="24" fill="#f5faf7"/>
    <text x="100" y="424" fill="#1c3a30" font-size="24" font-weight="700" letter-spacing="2">OPERATIONS AT A GLANCE</text>
    <g fill="#e1f1e8"><rect x="100" y="450" width="316" height="112" rx="13"/><rect x="442" y="450" width="316" height="112" rx="13"/><rect x="784" y="450" width="316" height="112" rx="13"/></g>
    <g fill="#1c3a30" font-size="32" font-weight="700"><text x="124" y="494">Members</text><text x="466" y="494">Savings</text><text x="808" y="494">Loans</text></g>
    <g fill="#426456" font-size="23"><text x="124" y="533">Onboarding + KYC</text><text x="466" y="533">Accounts + shares</text><text x="808" y="533">Risk + collections</text></g>
    <g fill="#1c3a30"><rect x="100" y="604" width="212" height="52" rx="26"/><rect x="362" y="604" width="212" height="52" rx="26"/><rect x="624" y="604" width="212" height="52" rx="26"/><rect x="886" y="604" width="214" height="52" rx="26"/></g>
    <g fill="#fff" font-size="23" font-weight="600" text-anchor="middle"><text x="206" y="638">Request</text><text x="468" y="638">Review</text><text x="730" y="638">Approve</text><text x="993" y="638">Post</text></g>
    <path d="M323 630h26m-8-8 8 8-8 8m244-8h26m-8-8 8 8-8 8m244-8h26m-8-8 8 8-8 8" fill="none" stroke="#0b8f73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="753" fill="#b0d1c2" font-size="21" letter-spacing="2">ILLUSTRATIVE WORKFLOW</text>
    <text x="1136" y="753" text-anchor="end" fill="#91dfc7" font-size="21" letter-spacing="2">01 / DELIVERY</text>
  </g>
</svg>
