<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Electronics store funnel measured stage conversions</title><desc id="desc">Define the events before recommending UX changes. The visual explains the work and is not a product screenshot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e26"/><stop offset="1" stop-color="#224d3b"/></linearGradient><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#c8e7d6" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="80" font-size="25" fill="#9ce6c7" font-weight="700">PRODUCT &amp; UX ANALYTICS · DATASET AUDIT</text><text x="60" y="181" font-size="83" fill="#ffffff" font-weight="800">Find the gap</text><text x="60" y="273" font-size="88" fill="#9ce6c7" font-weight="800">before the cart.</text><text x="64" y="325" font-size="28" fill="#cadfd0" font-weight="500">Define the events before recommending UX changes.</text><rect x="64" y="375" width="1072" height="322" rx="16" fill="#f4f7ed"/><text x="96" y="423" font-size="23" fill="#426655" font-weight="700">HISTORICAL ELECTRONICS STORE EVENTS</text><rect x="96" y="458" width="306" height="84" rx="12" fill="#d9ebe0"/><text x="249.0" y="512" font-size="31" fill="#14382d" font-weight="700" text-anchor="middle">Product view</text><rect x="464" y="458" width="306" height="84" rx="12" fill="#d9ebe0"/><text x="617.0" y="512" font-size="31" fill="#14382d" font-weight="700" text-anchor="middle">Cart intent</text><rect x="832" y="458" width="272" height="84" rx="12" fill="#d9ebe0"/><text x="968.0" y="512" font-size="31" fill="#14382d" font-weight="700" text-anchor="middle">Purchase</text><path d="M410 500h42m-10-10 10 10-10 10" fill="none" stroke="#247457" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M780 500h42m-10-10 10 10-10 10" fill="none" stroke="#247457" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="599" font-size="44" fill="#14382d" font-weight="750" text-anchor="middle">8.45%</text><text x="818" y="599" font-size="44" fill="#14382d" font-weight="750" text-anchor="middle">58.99%</text><text x="450" y="644" font-size="24" fill="#426655" font-weight="500" text-anchor="middle">View → cart</text><text x="818" y="644" font-size="24" fill="#426655" font-weight="500" text-anchor="middle">Cart → purchase</text><text x="64" y="753" font-size="20" fill="#b6d3c2" font-weight="600">MEHRAB MASHRAFI / CASE STUDY</text><text x="1136" y="753" font-size="20" fill="#9ce6c7" font-weight="600" text-anchor="end">08 / FUNNEL</text></g></svg>