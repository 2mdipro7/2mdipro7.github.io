<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Education data ingestion validation and quarantine</title><desc id="desc">Make rejected records and repeat loads visible. The visual explains the work and is not a product screenshot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e26"/><stop offset="1" stop-color="#224d3b"/></linearGradient><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#c8e7d6" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="80" font-size="25" fill="#9ce6c7" font-weight="700">DATA ENGINEERING · DEMONSTRATION</text><text x="60" y="181" font-size="83" fill="#ffffff" font-weight="800">Trust the records</text><text x="60" y="273" font-size="88" fill="#9ce6c7" font-weight="800">behind the report.</text><text x="64" y="325" font-size="28" fill="#cadfd0" font-weight="500">Make rejected records and repeat loads visible.</text><rect x="64" y="375" width="1072" height="322" rx="16" fill="#f4f7ed"/><text x="96" y="423" font-size="23" fill="#426655" font-weight="700">SYNTHETIC EDUCATION DATA DEMONSTRATION</text><rect x="96" y="448" width="300" height="93" rx="12" fill="#d9ebe0"/><text x="246" y="506" font-size="34" fill="#14382d" font-weight="700" text-anchor="middle">Ingest</text><rect x="450" y="448" width="300" height="93" rx="12" fill="#d9ebe0"/><text x="600" y="506" font-size="34" fill="#14382d" font-weight="700" text-anchor="middle">Validate</text><rect x="804" y="448" width="300" height="93" rx="12" fill="#d9ebe0"/><text x="954" y="506" font-size="34" fill="#14382d" font-weight="700" text-anchor="middle">Report</text><path d="M404 495h30m-10-10 10 10-10 10" fill="none" stroke="#247457" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M758 495h30m-10-10 10 10-10 10" fill="none" stroke="#247457" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 541v31" stroke="#aa7534" stroke-width="3"/><rect x="450" y="572" width="300" height="73" rx="10" fill="#f2e5cc"/><text x="600" y="619" font-size="28" fill="#785127" font-weight="650" text-anchor="middle">Quarantine issues</text><text x="96" y="606" font-size="40" fill="#14382d" font-weight="750">12,246</text><text x="96" y="645" font-size="23" fill="#426655" font-weight="500">Synthetic input records</text><text x="804" y="606" font-size="40" fill="#14382d" font-weight="750">58 checks</text><text x="804" y="645" font-size="23" fill="#426655" font-weight="500">Analytical contracts</text><text x="64" y="753" font-size="20" fill="#b6d3c2" font-weight="600">MEHRAB MASHRAFI / CASE STUDY</text><text x="1136" y="753" font-size="20" fill="#9ce6c7" font-weight="600" text-anchor="end">06 / PIPELINES</text></g></svg>