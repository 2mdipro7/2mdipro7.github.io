<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">LeadHarvest discovery to sales worklists</title><desc id="desc">Enrichment, validation, scoring and recovery. The visual explains the work and is not a product screenshot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e26"/><stop offset="1" stop-color="#224d3b"/></linearGradient><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#c8e7d6" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="80" font-size="25" fill="#9ce6c7" font-weight="700">LEADHARVEST · SALES OPERATIONS</text><text x="60" y="181" font-size="83" fill="#ffffff" font-weight="800">From company search</text><text x="60" y="273" font-size="88" fill="#9ce6c7" font-weight="800">to a usable worklist.</text><text x="64" y="325" font-size="28" fill="#cadfd0" font-weight="500">Enrichment, validation, scoring and recovery.</text><rect x="64" y="393" width="244" height="90" rx="12" fill="#2d5745" stroke="#597d65" stroke-width="2"/><text x="186" y="451" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">Discover</text><rect x="340" y="393" width="244" height="90" rx="12" fill="#2d5745" stroke="#597d65" stroke-width="2"/><text x="462" y="451" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">Enrich</text><rect x="616" y="393" width="244" height="90" rx="12" fill="#2d5745" stroke="#597d65" stroke-width="2"/><text x="738" y="451" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">Validate</text><rect x="892" y="393" width="244" height="90" rx="12" fill="#2d5745" stroke="#597d65" stroke-width="2"/><text x="1014" y="451" font-size="31" fill="#fff" font-weight="700" text-anchor="middle">Score</text><path d="M315 438h18m-10-10 10 10-10 10" fill="none" stroke="#9ce6c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M591 438h18m-10-10 10 10-10 10" fill="none" stroke="#9ce6c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M867 438h18m-10-10 10 10-10 10" fill="none" stroke="#9ce6c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1014 483v36H600v32M240 551v-32h720v32" fill="none" stroke="#9ce6c7" stroke-width="3"/><rect x="64" y="551" width="344" height="146" rx="16" fill="#f4f7ed"/><text x="88" y="603" font-size="31" fill="#14382d" font-weight="750">Priority list</text><text x="88" y="649" font-size="23" fill="#426655" font-weight="500">Complete contact signals</text><rect x="428" y="551" width="344" height="146" rx="16" fill="#f4f7ed"/><text x="452" y="603" font-size="31" fill="#14382d" font-weight="750">Phone only</text><text x="452" y="649" font-size="23" fill="#426655" font-weight="500">Usable calling route</text><rect x="792" y="551" width="344" height="146" rx="16" fill="#f4f7ed"/><text x="816" y="603" font-size="31" fill="#14382d" font-weight="750">Review queue</text><text x="816" y="649" font-size="23" fill="#426655" font-weight="500">Rejected or incomplete</text><text x="64" y="753" font-size="20" fill="#b6d3c2" font-weight="600">MEHRAB MASHRAFI / CASE STUDY</text><text x="1136" y="753" font-size="20" fill="#9ce6c7" font-weight="600" text-anchor="end">02 / AUTOMATION</text></g></svg>