<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 540 600" role="img" aria-labelledby="title"><title id="title">ERPNext to Power BI to reviewed brand reports</title><rect width="540" height="600" fill="#102e27"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="10" letter-spacing="2" fill="#cbdaba">BESTINBRANDS / REPORTING SYSTEM</text><text x="30" y="100" font-size="38" font-family="Georgia, serif" fill="#f6f7e9">From records</text><text x="30" y="144" font-size="38" font-family="Georgia, serif" fill="#f6f7e9">to review.</text><rect x="30" y="180" width="480" height="92" rx="5" fill="#f1f2e9"/><g transform="translate(52 201) scale(1.25)" fill="#287cb0"><path d="M2.88 0C1.29 0 0 1.29 0 2.88v18.24C0 22.71 1.29 24 2.88 24h18.24c1.59 0 2.88-1.29 2.88-2.88V2.88C24 1.29 22.71 0 21.12 0Zm5.04 5.76h8.254v2.146H7.92Zm0 5.033h7.85v2.146h-5.233v2.954h5.703v2.146H7.92Z"/></g><text x="104" y="218" font-size="20" font-weight="600" fill="#193b2c">ERPNext</text><text x="104" y="246" font-size="13" fill="#50634f">Sales &amp; inventory records</text><path d="M270 272v26m-6-6 6 6 6-6" stroke="#a0be7e" fill="none" stroke-width="2"/><rect x="30" y="298" width="480" height="104" rx="5" fill="#d4ef86"/><g transform="translate(52 324) scale(1.3333333333333333)" fill="#233e24"><path d="M10 12a1 1 0 0 1 1 1v11H4a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1h6Zm-2-.5V7a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v17h-4.5V13a1.5 1.5 0 0 0-1.5-1.5H8Zm5-6V1a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v22a1 1 0 0 1-1 1h-3.5V7A1.5 1.5 0 0 0 15 5.5h-2Z"/></g><text x="104" y="339" font-size="22" font-weight="600" fill="#173822">Power BI</text><text x="104" y="370" font-size="13" fill="#355132">Prepare. Model. Calculate.</text><path d="M270 402v26m-6-6 6 6 6-6" stroke="#a0be7e" fill="none" stroke-width="2"/><rect x="30" y="428" width="480" height="94" rx="5" fill="#204639"/><text x="54" y="466" font-size="20" fill="#f5f6e9">Brand reports</text><text x="54" y="496" font-size="13" fill="#d2dfc7">Reco